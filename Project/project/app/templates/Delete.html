<!-- app - templates - Delete.html file -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Delete User</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #f8f9fa, #e9ecef);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .delete-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.12);
      padding: 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }

    .delete-icon {
      width: 80px;
      height: 80px;
      background: #fff3f3;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }

    .delete-icon i {
      font-size: 36px;
      color: #dc3545;
    }

    .delete-card h2 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #2d2d2d;
      margin-bottom: 10px;
    }

    .delete-card p {
      color: #6c757d;
      font-size: 0.95rem;
      margin-bottom: 30px;
    }

    .user-badge {
      display: inline-block;
      background: #fff3f3;
      color: #dc3545;
      border: 1px solid #f5c6cb;
      border-radius: 8px;
      padding: 6px 16px;
      font-weight: 600;
      margin-bottom: 28px;
      font-size: 1rem;
    }

    .btn-confirm {
      background: #dc3545;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 28px;
      font-size: 0.95rem;
      font-weight: 600;
      transition: background 0.2s;
    }

    .btn-confirm:hover {
      background: #b02a37;
      color: #fff;
    }

    .btn-back {
      background: #f8f9fa;
      color: #495057;
      border: 1px solid #dee2e6;
      border-radius: 8px;
      padding: 10px 28px;
      font-size: 0.95rem;
      font-weight: 600;
      transition: background 0.2s;
    }

    .btn-back:hover {
      background: #e2e6ea;
      color: #343a40;
      text-decoration: none;
    }

    .divider {
      border: none;
      border-top: 1px solid #f0f0f0;
      margin: 24px 0;
    }
  </style>
</head>
<body>

  <div class="delete-card">

    <div class="delete-icon">
      <i class="fas fa-trash-alt"></i>
    </div>

    <h2>Delete User</h2>
    <p>You are about to permanently delete this record. This action cannot be undone.</p>

    <div class="user-badge">
      <i class="fas fa-user mr-2"></i>{{ user.name }}
    </div>

    <hr class="divider">

    <form method="post">
      {% csrf_token %}
      <div class="d-flex justify-content-center gap-3" style="gap: 12px;">
        <button type="submit" class="btn btn-confirm">
          <i class="fas fa-trash mr-2"></i> Delete
        </button>
        <a href="/" class="btn btn-back">
          <i class="fas fa-arrow-left mr-2"></i> Cancel
        </a>
      </div>
    </form>

  </div>

</body>
</html>
