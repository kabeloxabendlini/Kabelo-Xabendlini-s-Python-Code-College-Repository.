<!-- app - templates - Edit.html file -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit User</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #f8f9fa, #e9ecef);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
    }

    .form-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.12);
      padding: 40px;
      width: 100%;
      max-width: 560px;
    }

    .form-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .form-header .icon-wrap {
      width: 70px;
      height: 70px;
      background: #fff8e1;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
    }

    .form-header .icon-wrap i {
      font-size: 30px;
      color: #f59e0b;
    }

    .form-header h2 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #2d2d2d;
      margin-bottom: 4px;
    }

    .form-header p {
      color: #6c757d;
      font-size: 0.9rem;
    }

    .user-badge {
      display: inline-block;
      background: #fff8e1;
      color: #b45309;
      border: 1px solid #fde68a;
      border-radius: 8px;
      padding: 5px 14px;
      font-weight: 600;
      font-size: 0.9rem;
      margin-top: 6px;
    }

    /* Style Django's form.as_p labels */
    p label {
      font-weight: 600;
      color: #495057;
      font-size: 0.9rem;
      margin-bottom: 4px;
      display: block;
    }

    /* Style all inputs, selects, textareas */
    p input,
    p select,
    p textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #dee2e6;
      border-radius: 8px;
      font-size: 0.95rem;
      color: #495057;
      background: #f8f9fa;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
      box-sizing: border-box;
    }

    p input:focus,
    p select:focus,
    p textarea:focus {
      border-color: #f59e0b;
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.15);
      background: #fff;
    }

    p {
      margin-bottom: 18px;
    }

    .divider {
      border: none;
      border-top: 1px solid #f0f0f0;
      margin: 28px 0 24px;
    }

    .btn-update {
      width: 100%;
      background: #f59e0b;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 1rem;
      font-weight: 600;
      transition: background 0.2s;
    }

    .btn-update:hover {
      background: #d97706;
      color: #fff;
    }

    .btn-back {
      width: 100%;
      display: block;
      text-align: center;
      margin-top: 12px;
      background: #f8f9fa;
      color: #495057;
      border: 1px solid #dee2e6;
      border-radius: 8px;
      padding: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      transition: background 0.2s;
      text-decoration: none;
    }

    .btn-back:hover {
      background: #e2e6ea;
      color: #343a40;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="form-card">

    <div class="form-header">
      <div class="icon-wrap">
        <i class="fas fa-user-edit"></i>
      </div>
      <h2>Edit User</h2>
      <p>Update the details below and save your changes.</p>
      <div class="user-badge">
        <i class="fas fa-user mr-1"></i> {{ form.instance.name }}
      </div>
    </div>

    <hr class="divider">

    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      {{ form.as_p }}
      <hr class="divider">
      <button type="submit" class="btn-update">
        <i class="fas fa-save mr-2"></i> Update User
      </button>
      <a href="/" class="btn-back">
        <i class="fas fa-arrow-left mr-2"></i> Back to List
      </a>
    </form>

  </div>

</body>
</html>
